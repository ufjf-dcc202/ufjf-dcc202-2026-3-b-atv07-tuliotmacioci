<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
</head>
    <style>
        em {
            color: green;
        }
        code {
            text-decoration: underline;
            color: blue;
        }
    </style>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>Você pode aplicar um estilo <em>embutido</em> para um elemento usando <code>style</code> no <em>head</em>.</p>
        <code>color</code>
        <p>Cor texto de elemento.</p>
        <code>background-color</code>
        <p>Cor de fundo do elemento.</p>
    </main>
</body>
</html>
