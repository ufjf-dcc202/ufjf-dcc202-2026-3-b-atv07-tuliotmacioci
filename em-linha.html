<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em linha</title>
</head>
<body>
    <main>
        <h1>DCC202 CSS Em linha</h1>
        <p>Você pode aplicar um estilo <em>em linha</em> para um elemento usando <code>style</code>.</p>
        <code>color</code>
        <p style="color: green">Cor texto de elemento.</p>
        <code>background-color</code>
        <p style="background-color: green;">Cor de fundo do elemento.</p>
    </main>
</body>
</html>
